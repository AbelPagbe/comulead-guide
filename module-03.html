<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 03 — Team Spaces</title>
<link rel="stylesheet" href="assets/style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap');
.anim-wrap { margin-bottom: 32px; }
.anim-badge { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#4B33A8; background:#EDE9F8; padding:3px 10px; border-radius:20px; margin-bottom:10px; }
.anim-badge-dot { width:5px; height:5px; border-radius:50%; background:#0D9488; animation:abd 2s ease-in-out infinite; }
@keyframes abd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.anim-stepind { font-size:11px; color:#9CA3AF; margin-bottom:6px; font-weight:500; font-family:'Sora',sans-serif; }
.anim-pbar { height:3px; background:#E5E7EB; border-radius:2px; margin-bottom:12px; overflow:hidden; }
.anim-pfill { height:100%; background:linear-gradient(90deg,#4B33A8,#2653D4); border-radius:2px; transition:width .35s; }
.acursor { position:absolute; width:15px; height:15px; pointer-events:none; z-index:99; transition:left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1); filter:drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
.attip { position:absolute; background:#0C1E3E; color:#fff; font-size:10px; font-family:'Sora',sans-serif; font-weight:500; padding:4px 9px; border-radius:6px; pointer-events:none; z-index:100; opacity:0; transition:opacity .2s; max-width:210px; line-height:1.5; }
.attip::after { content:''; position:absolute; bottom:-5px; left:10px; border:5px solid transparent; border-bottom:none; border-top-color:#0C1E3E; }

/* ── Shell applicatif ── */
.appshell { background:#F9FAFB; border-radius:12px; border:1px solid #E5E7EB; overflow:hidden; position:relative; box-shadow:0 4px 16px rgba(12,30,62,.08); display:flex; min-height:280px; }
.appsidebar { width:160px; background:#fff; border-right:1px solid #F3F4F6; padding:10px 0; flex-shrink:0; }
.appmain { flex:1; padding:16px 18px; background:#F9FAFB; }

/* Sidebar app */
.sb-section { font-size:9px; font-weight:700; color:#9CA3AF; letter-spacing:.06em; text-transform:uppercase; padding:8px 12px 4px; font-family:'Sora',sans-serif; }
.sb-item { display:flex; align-items:center; gap:7px; padding:6px 12px; font-size:11px; font-family:'Sora',sans-serif; color:#374151; cursor:pointer; transition:background .15s; }
.sb-item:hover { background:#F3F4F6; }
.sb-item.active { background:#EEF3FD; color:#2653D4; font-weight:600; }
.sb-item.hl { background:#EDE9F8; color:#4B33A8; border-radius:6px; }
.sb-avatar { width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; color:#fff; flex-shrink:0; }
.sb-label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-arrow { font-size:8px; color:#9CA3AF; }
.sb-header { display:flex; align-items:center; justify-content:space-between; padding:6px 12px 4px; }
.sb-header-label { font-size:10px; font-weight:700; color:#0C1E3E; font-family:'Sora',sans-serif; }
.sb-add-btn { width:18px; height:18px; border-radius:4px; background:#F3F4F6; border:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:#6B7280; cursor:pointer; font-family:'Sora',sans-serif; transition:background .15s,box-shadow .2s; }
.sb-add-btn.hl { background:#EDE9F8; color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.15); }

/* Main app */
.page-title { font-size:15px; font-weight:700; color:#0C1E3E; font-family:'Sora',sans-serif; margin-bottom:10px; }
.stat-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.stat-card { border-radius:8px; padding:10px 12px; }
.stat-card.blue { background:linear-gradient(135deg,#2653D4,#1a3fa8); }
.stat-card.orange { background:linear-gradient(135deg,#F59E0B,#D97706); }
.stat-card.green { background:linear-gradient(135deg,#0D9488,#0a7a70); }
.stat-label { font-size:9px; color:rgba(255,255,255,.8); font-family:'Sora',sans-serif; margin-bottom:4px; }
.stat-value { font-size:18px; font-weight:700; color:#fff; font-family:'Sora',sans-serif; }

/* Modal overlay */
.modal-overlay { position:absolute; inset:0; background:rgba(12,30,62,.35); display:flex; align-items:center; justify-content:center; z-index:50; border-radius:12px; }
.modal-box { background:#fff; border-radius:12px; padding:20px; width:320px; box-shadow:0 8px 32px rgba(12,30,62,.18); position:relative; }
.modal-title { font-size:13px; font-weight:700; color:#0C1E3E; font-family:'Sora',sans-serif; margin-bottom:14px; }
.modal-close { position:absolute; top:14px; right:14px; font-size:14px; color:#9CA3AF; cursor:pointer; background:none; border:none; }
.modal-label { font-size:10px; font-weight:600; color:#374151; font-family:'Sora',sans-serif; margin-bottom:5px; }
.modal-input { width:100%; border:1.5px solid #2653D4; border-radius:6px; padding:8px 10px; font-size:12px; font-family:'Sora',sans-serif; color:#0C1E3E; box-sizing:border-box; outline:none; margin-bottom:14px; transition:border-color .2s,box-shadow .2s; }
.modal-input.hl { border-color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.15); }
.modal-input-search { width:100%; border:1.5px solid #E5E7EB; border-radius:6px; padding:8px 10px; font-size:12px; font-family:'Sora',sans-serif; color:#9CA3AF; box-sizing:border-box; outline:none; margin-bottom:12px; transition:border-color .2s,box-shadow .2s; }
.modal-input-search.hl { border-color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.15); }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; }
.modal-btn-cancel { font-size:11px; font-weight:600; color:#374151; background:#fff; border:1.5px solid #E5E7EB; border-radius:20px; padding:6px 16px; font-family:'Sora',sans-serif; cursor:pointer; }
.modal-btn-confirm { font-size:11px; font-weight:600; color:#fff; background:#2653D4; border:none; border-radius:20px; padding:6px 16px; font-family:'Sora',sans-serif; cursor:pointer; transition:box-shadow .2s; }
.modal-btn-confirm.hl { box-shadow:0 0 0 3px rgba(38,83,212,.25); }
.modal-section-title { font-size:10px; font-weight:700; color:#374151; font-family:'Sora',sans-serif; margin-bottom:8px; }
.modal-user-row { display:flex; align-items:center; gap:10px; padding:8px 10px; background:#EEF3FD; border-radius:8px; }
.modal-user-avatar { width:28px; height:28px; border-radius:50%; background:#9CA3AF; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; }
.modal-user-info .uname { font-size:11px; font-weight:600; color:#0C1E3E; font-family:'Sora',sans-serif; }
.modal-user-info .uemail { font-size:9px; color:#6B7280; font-family:'Sora',sans-serif; }

/* Menu contextuel */
.ctx-menu { position:absolute; background:#fff; border:1px solid #E5E7EB; border-radius:8px; box-shadow:0 4px 16px rgba(12,30,62,.12); padding:4px 0; min-width:170px; z-index:60; }
.ctx-item { display:flex; align-items:center; gap:8px; padding:7px 14px; font-size:11px; font-family:'Sora',sans-serif; color:#374151; cursor:pointer; transition:background .1s; }
.ctx-item:hover { background:#F9FAFB; }
.ctx-item.hl { background:#EDE9F8; color:#4B33A8; font-weight:600; }
.ctx-icon { font-size:12px; width:14px; text-align:center; }

/* Dossiers */
.folders-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.folder-card { background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:10px; transition:border-color .2s,box-shadow .2s; }
.folder-card.hl { border-color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.08); }
.folder-icon { font-size:20px; margin-bottom:4px; }
.folder-name { font-size:10px; font-weight:600; color:#2653D4; font-family:'Sora',sans-serif; }
.folder-meta { font-size:9px; color:#9CA3AF; font-family:'Sora',sans-serif; }
.new-folder-btn { background:#fff; border:1.5px dashed #D1D5DB; border-radius:8px; padding:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; transition:border-color .2s,box-shadow .2s; min-height:60px; }
.new-folder-btn.hl { border-color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.08); background:#FDFCFF; }
.new-folder-plus { font-size:16px; color:#9CA3AF; }
.new-folder-label { font-size:9px; color:#9CA3AF; font-family:'Sora',sans-serif; font-weight:500; }
</style>
</head>

/* ══════════════════════════════════════════════════
   MOTEUR D'ANIMATION
══════════════════════════════════════════════════ */
const animators = {};

function startAnimator(animId, steps) {
  if (animators[animId]) {
    clearTimeout(animators[animId].t1);
    clearTimeout(animators[animId].t2);
  }
  animators[animId] = { step:0, t1:null, t2:null, steps };
  runAnimator(animId);
}

function stopAllAnimators() {
  Object.keys(animators).forEach(id => {
    clearTimeout(animators[id].t1);
    clearTimeout(animators[id].t2);
  });
}

function runAnimator(animId) {
  const a = animators[animId];
  if (!a) return;
  const step = a.steps[a.step];
  const shell = document.getElementById('shell-' + animId);
  if (!shell) return;

  shell.querySelectorAll('.sb-add-btn,.sb-item,.sb-header,.ctx-item,.modal-input,.modal-input-search,.modal-btn-confirm,.modal-btn-cancel,.modal-close,.modal-user-row,.folder-card,.new-folder-btn')
       .forEach(e => e.classList.remove('hl'));

  const el  = document.getElementById(step.id);
  const cur = document.getElementById('cur-' + animId);
  const tip = document.getElementById('tip-' + animId);

  if (el && cur) {
    const sr = shell.getBoundingClientRect();
    const er = el.getBoundingClientRect();
    cur.style.left = (er.left - sr.left + er.width/2 - 7) + 'px';
    cur.style.top  = (er.top  - sr.top  + er.height/2 - 7) + 'px';
    tip.style.opacity = '0';

    setTimeout(() => {
      if (!document.getElementById('shell-' + animId)) return;
      el.classList.add('hl');
      const er2 = el.getBoundingClientRect();
      const sr2 = shell.getBoundingClientRect();
      tip.textContent = step.tip;
      tip.style.left = Math.max(4, er2.left - sr2.left + er2.width/2 - 80) + 'px';
      tip.style.top  = (er2.top - sr2.top - 46) + 'px';
      tip.style.opacity = '1';
      const nm = document.getElementById('sname-' + animId);
      if (nm) nm.textContent = step.label;
      const pf = document.getElementById('pfill-' + animId);
      if (pf) pf.style.width = Math.round(((a.step+1)/a.steps.length)*100) + '%';
    }, 420);

    setTimeout(() => { tip.style.opacity = '0'; }, 1500);
  }

  a.t1 = setTimeout(() => {
    a.step = (a.step + 1) % a.steps.length;
    if (a.step === 0) {
      if (shell) shell.querySelectorAll('.sb-add-btn,.sb-item,.sb-header,.ctx-item,.modal-input,.modal-input-search,.modal-btn-confirm,.modal-btn-cancel,.modal-close,.modal-user-row,.folder-card,.new-folder-btn')
                      .forEach(e => e.classList.remove('hl'));
      const pf = document.getElementById('pfill-' + animId);
      if (pf) pf.style.width = '0%';
      a.t2 = setTimeout(() => runAnimator(animId), 600);
    } else {
      runAnimator(animId);
    }
  }, 1800);
}

/* ══════════════════════════════════════════════════
   RENDU ÉTAPE
══════════════════════════════════════════════════ */
function renderStepContent(index) {
  stopAllAnimators();
  const step = STEPS_DATA[index];
  const lang = Lang.get();
  const data = step[lang];
  const isLast = (index === STEPS_DATA.length - 1);
  const animHTML = buildAnimStep(index, lang);

  let fieldsHtml = '<div class="fields-list">';
  data.fields.forEach(f => {
    fieldsHtml += `
      <div class="field-item ${f.required?'field-required':'field-optional'}">
        <div class="field-dot"></div>
        <div class="field-content">
          <div class="field-name">${f.name}</div>
          <div class="field-hint">${f.hint}</div>
        </div>
        <span class="field-tag ${f.required?'tag-required':'tag-optional'}">
          ${f.required?(lang==='fr'?'Requis':'Required'):(lang==='fr'?'Optionnel':'Optional')}
        </span>
      </div>`;
  });
  fieldsHtml += '</div>';

  const prevBtn = index > 0
    ? `<button class="btn btn-ghost" id="btn-prev">${svgArrowLeft()}${lang==='fr'?'Précédent':'Previous'}</button>`
    : `<a href="index.html" class="btn btn-ghost">${svgHome()}${lang==='fr'?'Hub':'Hub'}</a>`;

  const nextBtn = isLast
    ? `<button class="btn btn-success" id="btn-next">${lang==='fr'?'Terminer le module':'Complete module'}${svgCheck()}</button>`
    : `<button class="btn btn-primary" id="btn-next">${lang==='fr'?'Étape suivante':'Next step'}${svgArrowRight()}</button>`;

  document.getElementById('capsuleMain').innerHTML = `
    <div class="step-content">
      <div class="step-header">
        <span class="step-num-badge">${lang==='fr'?'Étape':'Step'} ${index+1}/${STEPS_DATA.length}</span>
        <span class="step-tab-label">${data.tab}</span>
      </div>
      <h1 class="step-title">${data.title}</h1>
      <p class="step-intro">${data.intro}</p>
      ${animHTML}
      <div class="fields-section">
        <div class="fields-title">${data.fieldsTitle}</div>
        ${fieldsHtml}
      </div>
      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div class="tip-text">${data.tip}</div>
      </div>
      <div class="step-nav">
        <div class="step-nav-left">${prevBtn}</div>
        <div class="step-nav-right">${nextBtn}</div>
      </div>
    </div>`;

  const btnNext = document.getElementById('btn-next');
  const btnPrev = document.getElementById('btn-prev');
  if (btnNext) btnNext.addEventListener('click', () => Capsule.next());
  if (btnPrev) btnPrev.addEventListener('click', () => Capsule.prev());

  setTimeout(() => startAnimator(step.animId, data.animSteps), 300);
}

function renderSidebarSteps(currentIndex) {
  const sidebar   = document.getElementById('capsuleSidebar');
  const lang      = Lang.get();
  const completed = Progress.getCompletedSteps(MODULE_ID);
  let html = `<div class="sidebar-module-name">${lang==='fr'?'Module 03 — Team Spaces':'Module 03 — Team Spaces'}</div>`;

  STEPS_DATA.forEach((step, i) => {
    const data     = step[lang];
    const isDone   = completed.includes(i) || Progress.isModuleDone(MODULE_ID);
    const isActive = (i === currentIndex) && !Progress.isModuleDone(MODULE_ID);
    let stateClass = 'todo', indClass = 'todo', indContent = i+1;
    if (isDone)        { stateClass='done';   indClass='done';   indContent=svgCheck(); }
    else if (isActive) { stateClass='active'; indClass='active'; }
    html += `
      <div class="sidebar-step ${stateClass}" data-step="${i}">
        <div class="step-indicator ${indClass}">${indContent}</div>
        <div class="step-info">
          <div class="step-name">${data.tab}</div>
          <div class="step-sub">${data.fields.length} ${lang==='fr'?'champs':'fields'}</div>
        </div>
      </div>`;
  });

  html += `
    <div class="sidebar-progress">
      <div class="sidebar-progress-label">
        <span>${lang==='fr'?'Progression':'Progress'}</span>
        <span class="sidebar-progress-pct">0%</span>
      </div>
      <div class="progress-track" style="height:6px"><div class="progress-fill" style="width:0%"></div></div>
    </div>`;
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('.sidebar-step').forEach(el => {
    const i = parseInt(el.dataset.step);
    const isDone   = completed.includes(i) || Progress.isModuleDone(MODULE_ID);
    const isActive = (i === currentIndex) && !Progress.isModuleDone(MODULE_ID);
    if (isDone || isActive || i <= completed.length) {
      el.addEventListener('click', () => Capsule.goToStep(i));
    }
  });
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  if (!Progress.isModuleUnlocked(MODULE_ID)) {
    const data = Progress.load();
    data[MODULE_ID] = data[MODULE_ID] || {};
    data[MODULE_ID].unlocked = true;
    localStorage.setItem('cml_guide_progress', JSON.stringify(data));
  }
  Capsule.registerRenderers(renderStepContent, renderSidebarSteps);
  Capsule.init({ moduleId: MODULE_ID, totalSteps: STEPS_DATA.length });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setTimeout(() => {
        renderStepContent(Capsule.getCurrent());
        renderSidebarSteps(Capsule.getCurrent());
      }, 10);
    });
  });
});

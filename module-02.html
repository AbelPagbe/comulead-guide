@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap');
.anim-wrap { margin-bottom: 32px; }
.anim-badge { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#4B33A8; background:#EDE9F8; padding:3px 10px; border-radius:20px; margin-bottom:10px; }
.anim-badge-dot { width:5px; height:5px; border-radius:50%; background:#0D9488; animation:abd 2s ease-in-out infinite; }
@keyframes abd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.anim-stepind { font-size:11px; color:#9CA3AF; margin-bottom:6px; font-weight:500; font-family:'Sora',sans-serif; }
.anim-pbar { height:3px; background:#E5E7EB; border-radius:2px; margin-bottom:12px; overflow:hidden; }
.anim-pfill { height:100%; background:linear-gradient(90deg,#4B33A8,#2653D4); border-radius:2px; transition:width .35s; }
.mshell { background:#fff; border-radius:12px; border:1px solid #E5E7EB; overflow:hidden; position:relative; box-shadow:0 4px 16px rgba(12,30,62,.08); }
.mheader { padding:16px 20px 0; border-bottom:1px solid #E5E7EB; }
.mtitle-row { font-size:14px; font-weight:700; color:#0C1E3E; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; font-family:'Sora',sans-serif; }
.msubtitle { font-size:11px; color:#6B7280; margin-bottom:10px; font-family:'Sora',sans-serif; }
.mtabs { display:flex; overflow-x:auto; }
.mtab { font-size:10px; font-weight:500; padding:8px 10px; color:#9CA3AF; border-bottom:2px solid transparent; display:flex; align-items:center; gap:4px; white-space:nowrap; font-family:'Sora',sans-serif; }
.mtab.active { color:#2653D4; border-bottom-color:#2653D4; font-weight:700; }
.mbody { padding:16px 20px 14px; }
.acursor { position:absolute; width:15px; height:15px; pointer-events:none; z-index:99; transition:left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1); filter:drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
.attip { position:absolute; background:#0C1E3E; color:#fff; font-size:10px; font-family:'Sora',sans-serif; font-weight:500; padding:4px 9px; border-radius:6px; pointer-events:none; z-index:100; opacity:0; transition:opacity .2s; max-width:200px; line-height:1.5; }
.attip::after { content:''; position:absolute; bottom:-5px; left:10px; border:5px solid transparent; border-bottom:none; border-top-color:#0C1E3E; }
/* Membres */
.members-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.members-title { font-size:13px; font-weight:700; color:#0C1E3E; font-family:'Sora',sans-serif; }
.mbtn-invite { font-size:10px; font-weight:600; color:#0C1E3E; border:1.5px solid #D1D5DB; border-radius:6px; padding:5px 12px; background:#fff; font-family:'Sora',sans-serif; transition:border-color .2s,box-shadow .2s; cursor:pointer; }
.mbtn-invite.hl { border-color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.12); background:#FDFCFF; }
.member-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #F3F4F6; }
.member-row:last-child { border-bottom:none; }
.member-row.hl { background:#F8F6FF; border-radius:8px; padding-left:6px; }
.avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; font-family:'Sora',sans-serif; flex-shrink:0; }
.member-info { flex:1; }
.member-name-row { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.member-name { font-size:12px; font-weight:600; color:#0C1E3E; font-family:'Sora',sans-serif; }
.badge-vous { font-size:9px; font-weight:700; color:#2653D4; background:#EEF3FD; padding:1px 6px; border-radius:10px; font-family:'Sora',sans-serif; }
.member-email { font-size:10px; color:#6B7280; font-family:'Sora',sans-serif; }
.member-date { font-size:9px; color:#9CA3AF; font-family:'Sora',sans-serif; }
.role-badge { font-size:10px; font-weight:600; padding:3px 10px; border-radius:6px; font-family:'Sora',sans-serif; }
.role-badge.admin { color:#0C1E3E; background:#F3F4F6; border:1.5px solid #E5E7EB; }
.role-badge.membre { color:#6B7280; background:#fff; font-weight:500; }
.role-badge.hl { box-shadow:0 0 0 3px rgba(75,51,168,.15); border-color:#4B33A8 !important; border:1.5px solid; }

.csearch { flex:1; min-width:140px; border:1.5px solid #E5E7EB; border-radius:6px; padding:6px 10px; font-size:10px; font-family:'Sora',sans-serif; color:#9CA3AF; background:#fff; transition:border-color .2s,box-shadow .2s; }

.cbtn-add.hl { box-shadow:0 0 0 3px rgba(38,83,212,.25); }
.cbtn-sec { font-size:10px; font-weight:600; color:#374151; background:#fff; border:1.5px solid #E5E7EB; border-radius:6px; padding:5px 10px; font-family:'Sora',sans-serif; cursor:pointer; transition:border-color .2s,box-shadow .2s; }
.cbtn-sec.hl { border-color:#4B33A8; box-shadow:0 0 0 3px rgba(75,51,168,.12); }
.ctable { width:100%; border-collapse:collapse; font-family:'Sora',sans-serif; }
.ctable th { font-size:9px; font-weight:700; color:#6B7280; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid #E5E7EB; text-align:left; }
.ctable td { font-size:10px; color:#374151; padding:7px 8px; border-bottom:1px solid #F3F4F6; vertical-align:middle; }
.ctable tr:last-child td { border-bottom:none; }
.ctable tr.hl td { background:#F8F6FF; }
.dot-ok { width:8px; height:8px; border-radius:50%; background:#0D9488; display:inline-block; }
.dot-err { width:8px; height:8px; border-radius:50%; background:#EF4444; display:inline-block; }

.pager-info { font-size:9px; color:#9CA3AF; font-family:'Sora',sans-serif; }
.pager-btns { display:flex; gap:4px; }
.pager-btn { width:22px; height:22px; border-radius:4px; border:1px solid #E5E7EB; background:#fff; font-size:10px; color:#374151; display:flex; align-items:center; justify-content:center; }
.pager-btn.active { background:#2653D4; color:#fff; border-color:#2653D4; }

.file-icon { width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.file-icon.pdf { background:#FEE2E2; }
.file-icon.xlsx { background:#D1FAE5; }
.file-info { flex:1; min-width:0; }
.file-name-row { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.file-name { font-size:11px; font-weight:600; color:#0C1E3E; font-family:'Sora',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
.file-type-badge { font-size:8px; font-weight:700; padding:1px 5px; border-radius:3px; }
.badge-pdf { background:#FEE2E2; color:#DC2626; }
.badge-xlsx { background:#D1FAE5; color:#059669; }
.file-meta { font-size:9px; color:#9CA3AF; font-family:'Sora',sans-serif; }
.file-space-badge { font-size:9px; font-weight:600; padding:1px 6px; border-radius:10px; font-family:'Sora',sans-serif; }

.file-actions { display:flex; gap:6px; color:#9CA3AF; font-size:12px; }
.file-action-btn { cursor:pointer; transition:color .2s; }
.file-action-btn.hl { color:#4B33A8; }

/* ══════════════════════════════════════════════════
   MOTEUR D'ANIMATION
══════════════════════════════════════════════════ */
const animators = {};

function startAnimator(animId, steps) {
  if (animators[animId]) {
    clearTimeout(animators[animId].t1);
    clearTimeout(animators[animId].t2);
  }
  animators[animId] = { step:0, t1:null, t2:null, steps };
  runAnimator(animId);
}

function stopAllAnimators() {
  Object.keys(animators).forEach(id => {
    clearTimeout(animators[id].t1);
    clearTimeout(animators[id].t2);
  });
}

function runAnimator(animId) {
  const a = animators[animId];
  if (!a) return;
  const step = a.steps[a.step];
  const shell = document.getElementById('shell-' + animId);
  if (!shell) return;

  shell.querySelectorAll('.mbtn-invite,.member-row,.role-badge,.csearch,.cbtn-add,.cbtn-sec,.ctable tr,.file-row,.ifilter-btn,.ibtn-add,.file-action-btn')
       .forEach(e => e.classList.remove('hl'));

  const el  = document.getElementById(step.id);
  const cur = document.getElementById('cur-' + animId);
  const tip = document.getElementById('tip-' + animId);

  if (el && cur) {
    const sr = shell.getBoundingClientRect();
    const er = el.getBoundingClientRect();
    cur.style.left = (er.left - sr.left + er.width/2 - 7) + 'px';
    cur.style.top  = (er.top  - sr.top  + er.height/2 - 7) + 'px';
    tip.style.opacity = '0';

    setTimeout(() => {
      if (!document.getElementById('shell-' + animId)) return;
      el.classList.add('hl');
      const er2 = el.getBoundingClientRect();
      const sr2 = shell.getBoundingClientRect();
      tip.textContent = step.tip;
      tip.style.left = Math.max(4, er2.left - sr2.left + er2.width/2 - 75) + 'px';
      tip.style.top  = (er2.top - sr2.top - 44) + 'px';
      tip.style.opacity = '1';
      const nm = document.getElementById('sname-' + animId);
      if (nm) nm.textContent = step.label;
      const pf = document.getElementById('pfill-' + animId);
      if (pf) pf.style.width = Math.round(((a.step+1)/a.steps.length)*100) + '%';
    }, 420);

    setTimeout(() => { tip.style.opacity = '0'; }, 1500);
  }

  a.t1 = setTimeout(() => {
    a.step = (a.step + 1) % a.steps.length;
    if (a.step === 0) {
      if (shell) shell.querySelectorAll('.mbtn-invite,.member-row,.role-badge,.csearch,.cbtn-add,.cbtn-sec,.ctable tr,.file-row,.ifilter-btn,.ibtn-add,.file-action-btn')
                      .forEach(e => e.classList.remove('hl'));
      const pf = document.getElementById('pfill-' + animId);
      if (pf) pf.style.width = '0%';
      a.t2 = setTimeout(() => runAnimator(animId), 600);
    } else {
      runAnimator(animId);
    }
  }, 1800);
}

/* ══════════════════════════════════════════════════
   RENDU ÉTAPE
══════════════════════════════════════════════════ */
function renderStepContent(index) {
  stopAllAnimators();

  const step = STEPS_DATA[index];
  const lang = Lang.get();
  const data = step[lang];
  const isLast = (index === STEPS_DATA.length - 1);
  const animHTML = buildAnimStep(index, lang);

  let fieldsHtml = '<div class="fields-list">';
  data.fields.forEach(f => {
    fieldsHtml += `
      <div class="field-item ${f.required?'field-required':'field-optional'}">
        <div class="field-dot"></div>
        <div class="field-content">
          <div class="field-name">${f.name}</div>
          <div class="field-hint">${f.hint}</div>
        </div>
        <span class="field-tag ${f.required?'tag-required':'tag-optional'}">
          ${f.required?(lang==='fr'?'Requis':'Required'):(lang==='fr'?'Optionnel':'Optional')}
        </span>
      </div>`;
  });
  fieldsHtml += '</div>';

  const prevBtn = index > 0
    ? `<button class="btn btn-ghost" id="btn-prev">${svgArrowLeft()}${lang==='fr'?'Précédent':'Previous'}</button>`
    : `<a href="index.html" class="btn btn-ghost">${svgHome()}${lang==='fr'?'Hub':'Hub'}</a>`;

  const nextBtn = isLast
    ? `<button class="btn btn-success" id="btn-next">${lang==='fr'?'Terminer le module':'Complete module'}${svgCheck()}</button>`
    : `<button class="btn btn-primary" id="btn-next">${lang==='fr'?'Étape suivante':'Next step'}${svgArrowRight()}</button>`;

  document.getElementById('capsuleMain').innerHTML = `
    <div class="step-content">
      <div class="step-header">
        <span class="step-num-badge">${lang==='fr'?'Étape':'Step'} ${index+1}/${STEPS_DATA.length}</span>
        <span class="step-tab-label">${data.tab}</span>
      </div>
      <h1 class="step-title">${data.title}</h1>
      <p class="step-intro">${data.intro}</p>
      ${animHTML}
      <div class="fields-section">
        <div class="fields-title">${data.fieldsTitle}</div>
        ${fieldsHtml}
      </div>
      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div class="tip-text">${data.tip}</div>
      </div>
      <div class="step-nav">
        <div class="step-nav-left">${prevBtn}</div>
        <div class="step-nav-right">${nextBtn}</div>
      </div>
    </div>`;

  // Attacher les événements via addEventListener — pas de onclick inline
  const btnNext = document.getElementById('btn-next');
  const btnPrev = document.getElementById('btn-prev');
  if (btnNext) btnNext.addEventListener('click', () => Capsule.next());
  if (btnPrev) btnPrev.addEventListener('click', () => Capsule.prev());

  setTimeout(() => startAnimator(step.animId, data.animSteps), 300);
}

function renderSidebarSteps(currentIndex) {
  const sidebar   = document.getElementById('capsuleSidebar');
  const lang      = Lang.get();
  const completed = Progress.getCompletedSteps(MODULE_ID);
  let html = `<div class="sidebar-module-name">${lang==='fr'?'Module 02 — Paramètres généraux':'Module 02 — General Settings'}</div>`;

  STEPS_DATA.forEach((step, i) => {
    const data     = step[lang];
    const isDone   = completed.includes(i) || Progress.isModuleDone(MODULE_ID);
    const isActive = (i === currentIndex) && !Progress.isModuleDone(MODULE_ID);
    let stateClass = 'todo', indClass = 'todo', indContent = i+1;
    if (isDone)        { stateClass='done';   indClass='done';   indContent=svgCheck(); }
    else if (isActive) { stateClass='active'; indClass='active'; }
    html += `
      <div class="sidebar-step ${stateClass}" data-step="${i}">
        <div class="step-indicator ${indClass}">${indContent}</div>
        <div class="step-info">
          <div class="step-name">${data.tab}</div>
          <div class="step-sub">${data.fields.length} ${lang==='fr'?'champs':'fields'}</div>
        </div>
      </div>`;
  });

  html += `
    <div class="sidebar-progress">
      <div class="sidebar-progress-label">
        <span>${lang==='fr'?'Progression':'Progress'}</span>
        <span class="sidebar-progress-pct">0%</span>
      </div>
      <div class="progress-track" style="height:6px"><div class="progress-fill" style="width:0%"></div></div>
    </div>`;
  sidebar.innerHTML = html;

  // Attacher clics sidebar via addEventListener
  sidebar.querySelectorAll('.sidebar-step').forEach(el => {
    const i = parseInt(el.dataset.step);
    const isDone   = completed.includes(i) || Progress.isModuleDone(MODULE_ID);
    const isActive = (i === currentIndex) && !Progress.isModuleDone(MODULE_ID);
    if (isDone || isActive || i <= completed.length) {
      el.addEventListener('click', () => Capsule.goToStep(i));
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Déverrouiller module-02 automatiquement si nécessaire (accès direct pendant tests)
  if (!Progress.isModuleUnlocked(MODULE_ID)) {
    const data = Progress.load();
    data[MODULE_ID] = data[MODULE_ID] || {};
    data[MODULE_ID].unlocked = true;
    localStorage.setItem('cml_guide_progress', JSON.stringify(data));
  }
  Capsule.registerRenderers(renderStepContent, renderSidebarSteps);
  Capsule.init({ moduleId: MODULE_ID, totalSteps: STEPS_DATA.length });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setTimeout(() => {
        renderStepContent(Capsule.getCurrent());
        renderSidebarSteps(Capsule.getCurrent());
      }, 10);
    });
  });
});

/* ─────────────────────────────────────────────────────────────
   RENDU ÉTAPE
────────────────────────────────────────────────────────────── */
function renderStepContent(index) {
  const step = STEPS_DATA[index];
  const lang = Lang.get();
  const data = step[lang];
  const isLast = index === STEPS_DATA.length - 1;

  // Construire les champs
  let fieldsHtml = '<div class="fields-list">';
  data.fields.forEach(f => {
    fieldsHtml += `
      <div class="field-item ${f.required ? 'field-required' : 'field-optional'}">
        <div class="field-dot"></div>
        <div class="field-content">
          <div class="field-name">${f.name}</div>
          <div class="field-hint">${f.hint}</div>
        </div>
        <span class="field-tag ${f.required ? 'tag-required' : 'tag-optional'}">
          ${f.required
            ? (lang === 'fr' ? 'Requis' : 'Required')
            : (lang === 'fr' ? 'Optionnel' : 'Optional')}
        </span>
      </div>
    `;
  });
  fieldsHtml += '</div>';

  // Navigation boutons
  const prevBtn = index > 0
    ? `<button class="btn btn-ghost" onclick="Capsule.prev()">
        ${svgArrowLeft()}
        ${lang === 'fr' ? 'Précédent' : 'Previous'}
       </button>`
    : `<a href="index.html" class="btn btn-ghost">
        ${svgHome()}
        ${lang === 'fr' ? 'Hub' : 'Hub'}
       </a>`;

  const nextBtn = isLast
    ? `<button class="btn btn-success" onclick="Capsule.next()">
        ${lang === 'fr' ? 'Terminer le module' : 'Complete module'}
        ${svgCheck()}
       </button>`
    : `<button class="btn btn-primary" onclick="Capsule.next()">
        ${lang === 'fr' ? 'Étape suivante' : 'Next step'}
        ${svgArrowRight()}
       </button>`;

  const html = `
    <div class="step-content">
      <div class="step-header">
        <span class="step-num-badge">${lang === 'fr' ? 'Étape' : 'Step'} ${index + 1}/${STEPS_DATA.length}</span>
        <span class="step-tab-label">${data.tab}</span>
      </div>
      <h1 class="step-title">${data.title}</h1>
      <p class="step-intro">${data.intro}</p>

      <div class="capture-wrapper">
        <div class="capture-label">${data.capLabel}</div>
        <img class="capture-img" src="${step.capture}" alt="${data.capLabel}" loading="lazy">
      </div>

      <div class="fields-section">
        <div class="fields-title">${data.fieldsTitle}</div>
        ${fieldsHtml}
      </div>

      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div class="tip-text">${data.tip}</div>
      </div>

      <div class="step-nav">
        <div class="step-nav-left">${prevBtn}</div>
        <div class="step-nav-right">${nextBtn}</div>
      </div>
    </div>
  `;

  document.getElementById('capsuleMain').innerHTML = html;
}

/* ─────────────────────────────────────────────────────────────
   RENDU SIDEBAR
────────────────────────────────────────────────────────────── */
function renderSidebarSteps(currentIndex) {
  const sidebar  = document.getElementById('capsuleSidebar');
  const lang     = Lang.get();
  const completed = Progress.getCompletedSteps(MODULE_ID);

  let stepsHtml = `
    <div class="sidebar-module-name" data-fr="Module 01 — Profil entreprise" data-en="Module 01 — Company Profile">
      ${lang === 'fr' ? 'Module 01 — Profil entreprise' : 'Module 01 — Company Profile'}
    </div>
  `;

  STEPS_DATA.forEach((step, i) => {
    const data   = step[lang];
    const isDone = completed.includes(i) || Progress.isModuleDone(MODULE_ID);
    const isActive = i === currentIndex && !Progress.isModuleDone(MODULE_ID);

    let stateClass = 'todo', indicatorClass = 'todo', indicatorContent = i + 1;
    if (isDone) { stateClass = 'done'; indicatorClass = 'done'; indicatorContent = svgCheck(); }
    else if (isActive) { stateClass = 'active'; indicatorClass = 'active'; indicatorContent = i + 1; }

    stepsHtml += `
      <div class="sidebar-step ${stateClass}" onclick="if(${isDone || isActive || i <= completed.length}) Capsule.goToStep(${i})">
        <div class="step-indicator ${indicatorClass}">${indicatorContent}</div>
        <div class="step-info">
          <div class="step-name">${data.tab}</div>
          <div class="step-sub">${data.fields.length} ${lang === 'fr' ? 'champs' : 'fields'}</div>
        </div>
      </div>
    `;
  });

  stepsHtml += `
    <div class="sidebar-progress">
      <div class="sidebar-progress-label">
        <span data-fr="Progression" data-en="Progress">${lang === 'fr' ? 'Progression' : 'Progress'}</span>
        <span class="sidebar-progress-pct">0%</span>
      </div>
      <div class="progress-track" style="height:6px">
        <div class="progress-fill" style="width:0%"></div>
      </div>
    </div>
  `;

  // Remplacer tout sauf le nœud progress (géré séparément)
  sidebar.innerHTML = stepsHtml;
}

/* ─────────────────────────────────────────────────────────────
   INIT
────────────────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  // Vérifier accès
  if (!Progress.isModuleUnlocked(MODULE_ID)) {
    window.location.href = 'index.html';
    return;
  }

  Capsule.registerRenderers(renderStepContent, renderSidebarSteps);
  Capsule.init({ moduleId: MODULE_ID, totalSteps: STEPS_DATA.length });

  // Re-render sur changement de langue
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setTimeout(() => {
        renderStepContent(Capsule.getCurrent());
        renderSidebarSteps(Capsule.getCurrent());
      }, 10);
    });
  });
});
